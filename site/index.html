function openDetail(type,id){let x=byId(type,id);if(!x)return;detailRef={type,id};document.getElementById('detail-type').textContent=T(({projects:'Dự án',sites:'Công trình',items:'Hạng mục',tasks:'Công việc',records:'Hồ sơ',contracts:'Hợp đồng',vendors:'Nhà thầu',companies:'Công ty',staff:'Nhân sự',recordTypes:'Loại hồ sơ',approvals:'Cơ cấu duyệt',departments:'Phòng ban',positions:'Chức vụ',meetings:'Meeting',notes:'Ghi chú'})[type]||type);document.getElementById('detail-title').textContent=x.name||recordTypeLabel(x);document.getElementById('detail-sub').innerHTML=x.status?`<span class="pill">${esc(T(x.status))}</span>`:'';document.getElementById('detail-body').innerHTML=detailContent(type,x);if(!document.getElementById('detail').open)document.getElementById('detail').showModal()}
function refreshDetail(){if(detailRef){let {type,id}=detailRef;let x=byId(type,id);if(!x){closeDialog('detail');return}document.getElementById('detail-title').textContent=x.name||recordTypeLabel(x);document.getElementById('detail-body').innerHTML=detailContent(type,x);document.getElementById('detail-sub').innerHTML=x.status?`<span class="pill">${esc(T(x.status))}</span>`:''}}

function recordDetail(r){let linkedContract=contractOfRecord(r),children=state.records.filter(x=>x.parentId===r.id),bundle=rootOf(r),flow=approvalFor(r);return `${editAction('records',r)}${detailFields([['Mã hồ sơ',r.code],['Cách ghép bộ hồ sơ',r.bundleRole==='main'?'Hồ sơ chính – Tờ trình':r.bundleRole==='attachment'?'Hồ sơ kèm theo':'Chưa ghép bộ'],['Loại hồ sơ',recordTypeLabel(r)],['Trạng thái',r.status],['Next action',nextActionFor(r)],['Ngày lập hồ sơ',shortDate(r.createdAt)],['Người lập',li('staff',r.authorId)],['Ngày nhận',shortDate(r.receivedAt)],['Người gửi',li('staff',r.senderId)],['Ngày trả hồ sơ ký',shortDate(r.returnedAt)],['Người nhận',li('staff',r.receiverId)],['Ngày hoàn thành hồ sơ',shortDate(r.completedAt)],['Lưu tại',r.storage],['Dự án',li('projects',r.projectId)],['Công trình',li('sites',r.siteId)],['Hạng mục',li('items',r.itemId)]])}${r.parentId?section('Hồ sơ chính',smallKV('Mã hồ sơ chính',bundle.code)+linked(bundle.name,'records',bundle.id)):''}${children.length?section('Hồ sơ kèm theo',children.map(c=>`<div class="sub"><span class="badge">${esc(c.code)}</span> ${linked(c.name,'records',c.id)}</div>`).join('')):''}${flow?section('Cơ cấu duyệt',`<div>${flow.steps.map((step,i)=>`<div class="flow-step ${i<(r.approvalIndex||0)?'complete':i===(r.approvalIndex||0)?'current':''}">${i+1}. ${esc(li('staff',step.personId))}${step.note?' · '+esc(step.note):''}</div>`).join('')}</div>${nextApprover(r)?`<button class="secondary" onclick="approveRecord('${r.id}')">${T('Duyệt')} · ${esc(nextApprover(r).name)}</button>`:''}`):section('Cơ cấu duyệt',`<button class="secondary" onclick="closeDialog('detail');showPage('company');openForm('approval')">+ ${T('Tạo cơ cấu duyệt')}</button>`)}${r.kind==='payment'?section('Thanh toán',detailFields([['Hạng mục chi',r.payment?.expense],['Nhà cung cấp',r.payment?.supplier],['Nguồn chi phí',r.payment?.fund],['Gói thầu',r.payment?.package],['Số tiền',money(r.payment?.amount)],['Ngày thanh toán',shortDate(r.payment?.paidDate)]])):''}${linkedContract?section('Hợp đồng',linked(linkedContract.name,'contracts',linkedContract.id)):''}<div class="actions">${(r.kind==='payment'?['Đang trình HSTT','Bổ sung HS','Chờ thanh toán','Đã thanh toán']:['Nhận hồ sơ','Đang trình','Chờ ký','Báo cáo','Hoàn thành']).filter(s=>s!==r.status).map(s=>`<button class="secondary" onclick="changeRecordStatus('${r.id}','${s}');refreshDetail()">${esc(s)}</button>`).join('')}</div>`}

function contractDetail(c){let v=byId('vendors',c.vendorId),pay=paymentRecords(c),filteredRows=(c.acceptances||[]).filter(a=>(!contractFilter.from||a.dateTime?.slice(0,10)>=contractFilter.from)&&(!contractFilter.to||a.dateTime?.slice(0,10)<=contractFilter.to));let pending=pay.filter(r=>r.status==='Đang trình HSTT'&&!c.acceptances.some(a=>a.recordId===r.id));return `${editAction('contracts',c)}${detailFields([['Hạng mục công việc',c.work||li('items',c.itemId)],['Đơn vị ký HD',li('companies',c.companyId)],['Nhà thầu',v?.name],['Địa chỉ nhà thầu',v?.address],['Người đại diện',v?.representative],['Chức vụ',v?.role],['Giá trị HD',money(c.value)],['Phương thức thanh toán',c.method],['Thời gian thực hiện',[shortDate(c.start),shortDate(c.end)].filter(Boolean).join(' → ')],['Ngày hoàn thành hồ sơ',shortDate(byId('records',c.recordId)?.completedAt)],['Ngày quyết toán',shortDate(c.settlementDate)]])}${section('Hồ sơ',linked(li('records',c.recordId),'records',c.recordId))}${section('Thanh toán',`${pay.map(r=>`<div class="sub"><span class="pill">${esc(T(r.status))}</span> ${linked(r.name,'records',r.id)}<div class="meta">${money(r.payment?.amount)} · ${bundleOf(r).length} ${T('Hồ sơ')} · ${r.completedAt?`${T('Ngày hoàn thành hồ sơ')}: ${shortDate(r.completedAt)}`:''}</div></div>`).join('')||'<span class="muted">—</span>'}<button class="secondary" onclick="closeDialog('detail');openForm('records','',{'kind':'payment','bundleRole':'main','typeId':'rt5','contractId':'${c.id}'})">+ ${T('Đợt thanh toán')}</button>`)}${section('Nghiệm thu',`${pending.length?`<div class="notice-inline">${pending.map(r=>`${esc(r.code)} · ${T('Đang trình HSTT')} · <button class="secondary" onclick="openForm('acceptance','',{'contractId':'${c.id}','recordId':'${r.id}'})">${T('Nghiệm thu')}</button>`).join('<br>')}</div>`:''}<div class="form-inline"><label class="field">${T('Ngày')}<input type="date" value="${esc(contractFilter.anchor)}" onchange="contractFilter.anchor=this.value;setAcceptancePeriod(contractFilter.mode)"></label>${['day','month','year'].map((mode,i)=>`<button class="secondary ${contractFilter.mode===mode?'on':''}" onclick="setAcceptancePeriod('${mode}')">${T(['Ngày','Tháng','Năm'][i])}</button>`).join('')}<label class="field">${T('Từ ngày')}<input type="date" value="${esc(contractFilter.from)}" onchange="contractFilter.from=this.value;contractFilter.mode='custom';refreshDetail()"></label><label class="field">${T('Đến ngày')}<input type="date" value="${esc(contractFilter.to)}" onchange="contractFilter.to=this.value;contractFilter.mode='custom';refreshDetail()"></label><button class="secondary" onclick="contractFilter={from:'',to:'',mode:'all',anchor:contractFilter.anchor};refreshDetail()">${T('Xóa lọc')}</button><button class="primary" onclick="openForm('acceptance','',{'contractId':'${c.id}'})">+ ${T('Nghiệm thu')}</button></div><div class="table-wrap wide-table"><table><thead><tr>${['Ngày giờ','Công việc theo HD','Biên bản nghiệm thu','Lũy kế KLCV theo đợt','Lũy kế KLCV đã hoàn thành','Số tiền nghiệm thu','Số tiền đã thanh toán','Số tiền cần thanh toán đợt này','Hồ sơ thanh toán'].map(t=>`<th>${T(t)}</th>`).join('')}</tr></thead><tbody>${filteredRows.map(a=>`<tr><td>${esc(a.dateTime?.replace('T',' ')||'')}</td><td>${esc(a.work)}</td><td>${esc(a.minute)}</td><td>${esc(a.periodQty)}</td><td>${esc(a.totalQty)}</td><td>${money(a.accepted)}</td><td>${money(a.paid)}</td><td>${money(a.due)}</td><td>${a.recordId?openButton('records',a.recordId,'Xem hồ sơ'):'—'}</td></tr>`).join('')||'<tr><td colspan="9">—</td></tr>'}</tbody></table></div>`)}`}
function setAcceptancePeriod(mode){contractFilter.mode=mode;let [y,m,d]=(contractFilter.anchor||dateNow()).split('-').map(Number);if(mode==='day'){contractFilter.from=contractFilter.to=contractFilter.anchor}else if(mode==='month'){contractFilter.from=iso(y,m-1,1);contractFilter.to=iso(y,m-1,new Date(y,m,0).getDate())}else if(mode==='year'){contractFilter.from=iso(y,0,1);contractFilter.to=iso(y,11,31)}refreshDetail()}

if(type==='staff')return `${editAction(type,x)}${detailFields([['Công ty',li('companies',x.companyId)],['Phòng ban',staffDepartment(x)],['Chức vụ',staffPosition(x)],['SDT',x.phone],['Email',x.email]])}`;
if(type==='departments'||type==='positions')return `${editAction(type,x)}${detailFields([['Công ty',li('companies',x.companyId)]])}`;
if(type==='approvals')return `${editAction(type,x)}${detailFields([['Loại hồ sơ',li('recordTypes',x.typeId)+' – '+li('companies',x.companyId)]])}${x.steps.map((s,i)=>`<div class="flow-step">${i+1}. ${esc(li('staff',s.personId))} · ${esc(s.note)}</div>`).join('')}`;
if(type==='vendors'){let items=state.items.filter(i=>i.vendorId===x.id),cs=state.contracts.filter(c=>c.vendorId===x.id);return `${editAction(type,x)}${detailFields([['Địa chỉ',x.address],['Người đại diện',x.representative],['Chức vụ',x.role],['SDT',x.phone],['Báo cáo',x.report]])}${section('Hạng mục',items.map(i=>linked(i.name,'items',i.id)).join('')||'—')}${section('Hợp đồng',cs.map(c=>linked(c.name,'contracts',c.id)).join('')||'—')}${section('Hồ sơ',state.records.filter(r=>cs.some(c=>c.id===r.contractId)).map(r=>linked(r.name,'records',r.id)).join('')||'—')}`}
if(type==='items')return `${editAction(type,x)}${detailFields([['Công trình',li('sites',x.siteId)],['Dự án',li('projects',projectOfSite(x.siteId))],['Phòng ban',x.department],['Nội dung',x.body],['Người phụ trách',li('staff',x.ownerId)],['Nhà thầu',li('vendors',x.vendorId)],['Tiến độ',x.progress+'%'],['Trạng thái',x.status],['Next action',x.nextAction],['Ngày bắt đầu',shortDate(x.start)],['Ngày kết thúc',shortDate(x.end)]])}${section('Công việc',state.tasks.filter(t=>t.itemId===x.id).map(t=>linked(t.name,'tasks',t.id)).join('')||'—')}${section('Hồ sơ',state.records.filter(r=>r.itemId===x.id).map(r=>linked(r.name,'records',r.id)).join('')||'—')}`;
if(type==='sites')return `${editAction(type,x)}${detailFields([['Dự án',li('projects',x.projectId)],['Vị trí',x.location],['Người phụ trách',li('staff',x.managerId)],['Phân đoạn',x.phase],['Trạng thái',x.status],['Next action',x.nextAction],['Bản vẽ',x.drawing],['Ngày bắt đầu',shortDate(x.start)],['Ngày kết thúc',shortDate(x.end)]])}${section('Hạng mục',state.items.filter(i=>i.siteId===x.id).map(i=>linked(i.name,'items',i.id)).join('')||'—')}`;
if(type==='projects')return `${editAction(type,x)}${detailFields([['Chủ đầu tư',x.investor],['Giai đoạn',x.phase],['Thông tin pháp lý',x.legal],['Link file',x.file],['Ghi chú',x.note]])}${section('Công trình',state.sites.filter(s=>s.projectId===x.id).map(s=>linked(s.name,'sites',s.id)).join('')||'—')}`;

function input(label,key,value='',type='text',opt={}){let required=opt.required?'required':'',min=type==='number'?'min="0"':'',wide=opt.wide?' wide':'';let ctrl=type==='textarea'?`<textarea name="${key}" ${required}>${esc(value)}</textarea>`:`<input name="${key}" type="${type}" value="${esc(value)}" ${required} ${min} ${type==='number'?'step="any"':''}>`;return `<label class="field${wide}">${esc(T(label))}${ctrl}</label>`}

function refreshDependencyChoices(preferredKey='',preferredId=''){let form=document.getElementById('entry-form');for(let control of form.querySelectorAll('select[name]')){let key=control.name;if(!dependencyKind(key))continue;let current=key===preferredKey?preferredId:control.value,label=control.closest('label')?.firstChild?.textContent||key;let candidates=dependencyOptions(key);control.innerHTML=`<option value="">— ${esc(label)} —</option>`+candidates.map(item=>`<option value="${esc(item.id)}">${esc(item.name)}</option>`).join('');control.value=candidates.some(item=>item.id===current)?current:''}}
function restoreParentForm(){let parent=formStack.pop();if(!parent)return;formRef=parent.ref;document.getElementById('form-sub').textContent=parent.sub;document.getElementById('form-title').textContent=parent.title;document.getElementById('form-fields').innerHTML=parent.html;for(let field of document.getElementById('entry-form').elements){if(field.name&&parent.values[field.name]!==undefined){if(field.type==='checkbox')field.checked=parent.values[field.name];else field.value=parent.values[field.name]}}document.getElementById('form-dialog').showModal();refreshDependencyChoices(parent.key,parent.createdId);if(parent.key==='mainCode'&&parent.createdId){let record=byId('records',parent.createdId),input=document.querySelector('#main-code-field input'),datalist=document.getElementById('main-record-codes');if(input)input.value=record?.code||'';if(datalist&&record)datalist.insertAdjacentHTML('beforeend',`<option value="${esc(record.code)}">${esc(record.name)}</option>`)}showMissingDependency()}

function createDependency(key){let kind=key==='mainCode'?'records':dependencyKind(key);if(!kind)return;let form=document.getElementById('entry-form'),data=Object.fromEntries(new FormData(form)),companyId=data.companyId||'',projectId=data.projectId||'',siteId=data.siteId||'';if(kind==='department'||kind==='position'||kind==='staff'){if(!companyId){showDependencyNotice('Chọn hoặc tạo Công ty trước.','companyId');return}}if(kind==='sites'&&!projectId){showDependencyNotice('Chọn hoặc tạo Dự án trước.','projectId');return}if(kind==='items'&&!siteId){showDependencyNotice('Chọn hoặc tạo Công trình trước.','siteId');return}let preset={companyId,projectId,siteId};if(key==='mainCode')preset={companyId,kind:'normal',bundleRole:'main',typeId:state.recordTypes.find(type=>norm(type.name).includes('to trinh'))?.id||''};if(kind==='records'&&formRef?.type==='acceptance'){preset={kind:'payment',contractId:data.contractId,typeId:'rt5',bundleRole:'main'}}formStack.push({ref:formRef,html:document.getElementById('form-fields').innerHTML,sub:document.getElementById('form-sub').textContent,title:document.getElementById('form-title').textContent,values:formDraft(),key,createdId:''});document.getElementById('form-dialog').close();openForm(kind,'',preset)}

function setSaveStatus(status){document.getElementById('save-indicator').textContent=status}
function saveAlert(show){document.getElementById('save-alert').classList.toggle('hide',!show)}
async function importBackup(event){let file=event.target.files?.[0];event.target.value='';if(!file)return;try{let backup=JSON.parse(await file.text());if(backup.app!=='cat-workspace')throw new Error('Không đúng file backup của website này');let replacement=validateWorkspaceData(backup.data);if(!confirm('Nhập backup sẽ thay toàn bộ dữ liệu hiện tại của website mới. Tiếp tục?'))return;state=replacement;save();toast('Đang khôi phục dữ liệu. Chờ nhãn Đã lưu trước khi rời trang.')}catch(error){toast('Không nhập được backup: '+error.message)}}
function exportBackup(){let blob=new Blob([JSON.stringify({app:'cat-workspace',exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`cat-workspace-${dateNow()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function flushSave(){if(saving||!dirty||conflicted||!workspaceId)return;saving=true;dirty=false;let snapshot=JSON.parse(JSON.stringify(state));try{let {data,error}=await cloud.rpc('cat_save_workspace',{p_workspace_id:workspaceId,p_expected_version:workspaceVersion,p_data:snapshot});if(error)throw error;if(Number(data)<0){conflicted=true;dirty=true;setSaveStatus('Xung đột dữ liệu');saveAlert(true);return}workspaceVersion=Number(data);setSaveStatus(dirty?'Đang lưu…':'Đã lưu');saveAlert(false)}catch(error){dirty=true;setSaveStatus('Chưa lưu');saveAlert(true);console.error('Save failed',error)}finally{saving=false;if(dirty&&!conflicted&&document.getElementById('save-alert').classList.contains('hide'))setTimeout(flushSave,100)}}
function retrySave(){if(conflicted){toast('Dữ liệu ở phiên khác đã thay đổi. Xuất backup trước khi tải lại.');return}saveAlert(false);setSaveStatus('Đang lưu…');flushSave()}
async function reloadCloud(){if(dirty&&!confirm('Dữ liệu chưa lưu sẽ mất. Tải lại từ Supabase?'))return;conflicted=false;dirty=false;saveAlert(false);await loadWorkspace()}
function validateWorkspaceData(value){let base=emptyState();if(!value||typeof value!=='object'||Array.isArray(value))throw new Error('Dữ liệu Supabase không đúng định dạng');for(let key of Object.keys(base)){if((key==='notes'||key==='positions')&&value[key]===undefined)continue;if(!Array.isArray(value[key]))throw new Error(`Thiếu danh sách ${key}`)}let data={...value,notes:value.notes??[],positions:value.positions??[]};for(let person of data.staff){for(let [key,legacy,collection,type] of [['departmentId','department','departments','department'],['positionId','title','positions','position']]){let linked=data[collection].find(item=>item.id===person[key]&&item.companyId===person.companyId);if(linked)continue;let name=String(person[legacy]||'').trim();if(!name){person[key]='';continue}let item=data[collection].find(item=>item.companyId===person.companyId&&norm(item.name)===norm(name));if(!item){item={id:uid(type),name,companyId:person.companyId};data[collection].push(item)}person[key]=item.id}}return data}

async function loadWorkspace(){setSaveStatus('Đang tải…');let {data,error}=await cloud.from('cat_workspaces').select('id,data,version').eq('owner_id',activeUser.id).maybeSingle();if(error)throw error;if(!data){let created=await cloud.from('cat_workspaces').insert({owner_id:activeUser.id,data:emptyState()}).select('id,data,version').single();if(created.error)throw created.error;data=created.data}state=validateWorkspaceData(data.data);workspaceId=data.id;workspaceVersion=Number(data.version);dirty=false;conflicted=false;saveAlert(false);document.querySelector('.shell').classList.remove('booting');document.getElementById('auth-screen').classList.add('hide');setSaveStatus('Đã lưu');render()}
async function initializeAuth(){let config=window.CAT_CONFIG;if(!config?.url||!config?.publishableKey||!window.supabase?.createClient){document.getElementById('auth-error').textContent='Website chưa được cấu hình Supabase. Kiểm tra môi trường triển khai.';return}cloud=window.supabase.createClient(config.url,config.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}});try{let {data,error}=await cloud.auth.getSession();if(error)throw error;if(data.session?.user){activeUser=data.session.user;await loadWorkspace()}}catch(error){document.getElementById('auth-error').textContent=error.message||'Không kết nối được Supabase'}}
async function login(event){event.preventDefault();let form=event.currentTarget,email=form.elements.email.value.trim(),password=form.elements.password.value,msg=document.getElementById('auth-error');msg.textContent='Đang đăng nhập…';if(!cloud){msg.textContent='Website chưa được cấu hình Supabase.';return}let {data,error}=await cloud.auth.signInWithPassword({email,password});form.elements.password.value='';if(error){msg.textContent='Không đăng nhập được: '+error.message;return}activeUser=data.user;try{await loadWorkspace();msg.textContent=''}catch(e){msg.textContent='Đăng nhập thành công nhưng chưa tải được dữ liệu: '+e.message}}
async function logout(){if(dirty||saving){toast('Đợi lưu xong hoặc xuất backup trước khi đăng xuất.');return}await cloud?.auth.signOut();activeUser=null;workspaceId='';document.querySelector('.shell').classList.add('booting');document.getElementById('auth-screen').classList.remove('hide')}
window.addEventListener('beforeunload',e=>{if(dirty||saving){e.preventDefault();e.returnValue=''}});
document.getElementById('login-form').addEventListener('submit',login);
document.getElementById('entry-form').addEventListener('submit',submitForm);
document.getElementById('lang').addEventListener('click',()=>{lang=lang==='vi'?'en':'vi';document.documentElement.lang=lang;render();refreshDetail()});for(let id of ['detail','form-dialog','transition-dialog'])document.getElementById(id).addEventListener('click',e=>{if(e.target.id===id)e.target.close()});initializeAuth();
</script></body></html>
